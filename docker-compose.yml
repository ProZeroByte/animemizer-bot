services:
  bot:
    image: animemizer-bot:latest
    build: .
    container_name: animemizer-bot
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 416M
    expose:
      - "8080"
    env_file:
      - .env
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - JAVA_TOOL_OPTIONS=-Xmx256m -Xms256m -XX:+UseContainerSupport
    networks:
      - external-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 20s
    read_only: true
    tmpfs:
      - /tmp:size=64m

networks:
  external-net:
    external: true
